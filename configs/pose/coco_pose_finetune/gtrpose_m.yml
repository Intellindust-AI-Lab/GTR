__include__: [
  '../../dataset/coco_pose.yml',
  '../gtrpose_base.yml',
]

output_dir: outputs/coco_pose_finetune/gtrpose_m

ViTAdapterSpatialSwiGLU:
  embed_dim: 256
  num_heads: 4
  weights_path: weights/vit_tinyplus_spatial_swiglu_distilled.pth

GTREncoder:
  in_channels: [256, 256, 256]
  hidden_dim: 256

GTRPoseTransformer:
  hidden_dim: 256
  dim_feedforward: 512
  num_decoder_layers: 4

epochs: 92

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.000025
    -
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.000025
      weight_decay: 0.
    -
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 45, 90]

  collate_fn:
    stop_epoch: 90
