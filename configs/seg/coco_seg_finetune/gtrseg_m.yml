__include__: [
  '../../dataset/coco_instance.yml',
  '../gtrseg_base.yml',
]

output_dir: outputs/coco_seg_finetune/gtrseg_m

ViTAdapterSpatialSwiGLU:
  embed_dim: 256
  num_heads: 4
  weights_path: weights/vit_tinyplus_spatial_swiglu_distilled.pth

GTREncoder:
  in_channels: [256, 256, 256]
  hidden_dim: 256

GTRTransformer:
  feat_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 1024

optimizer:
  params:
    -
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.000015
    -
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.000015
      weight_decay: 0.
    -
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  weight_decay: 0.0001
