task: depth

model: GTRDepth
criterion: GTRDepthCriterion

checkpoint_freq: 1
val_freq: 1

GTRDepth:
  backbone: ViTAdapter
  encoder: GTREncoder
  decoder: DPTDepthHead

ViTAdapter:
  interaction_indexes: [3, 7, 11]
  multi_layer_same_res: True

GTREncoder:
  in_channels: [192, 192, 192]
  hidden_dim: 256
  scale_factors: [2.0, 1.0, 0.5]
  feat_strides: [8, 16, 32]
  num_blocks: 3
  layer_norm: True
  act: silu
  force_contiguous: False

DPTDepthHead:
  in_channels: [256, 256, 256]
  features: 128
  use_bn: False

GTRDepthCriterion:
  weight_dict: {loss_silog: 1.0}
  lambd: 0.5

eval_spatial_size: [640, 640]

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomHorizontalFlip}
        - {type: ResizeShortestEdge, size: 640}
        - {type: RandomCrop, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}

      policy: stop_epoch
      start_epoch: 0
      stop_epoch: 55
      remove_ops: ['RandomPhotometricDistort']

  collate_fn:
    mixup_prob: 0.0
    base_size_repeat: ~
    ema_restart_decay: 0.999

  total_batch_size: 16

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: ResizeShortestEdge, size: 640}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy: default
  total_batch_size: 16

print_freq: 50
output_dir: ./logs

sync_bn: True
find_unused_parameters: True

use_amp: False

use_ema: True
ema:
  type: ModelEMA
  decay: 0.999
  warmups: 500
  start: 0

clip_max_norm: 0.1

optimizer:
  type: AdamW

  params:
    -
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00002
    -
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 60

lrsheduler: flatcosine
lr_gamma: 0.1
warmup_iter: 500
flat_epoch: 15
