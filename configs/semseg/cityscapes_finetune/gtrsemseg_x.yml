__include__: [
  '../../dataset/cityscapes_semseg.yml',
  '../gtrsemseg_base.yml',
]

output_dir: outputs/cityscapes_finetune/gtrsemseg_x

ViTAdapterSpatialSwiGLU:
  embed_dim: 384
  num_heads: 6
  ffn_ratio: 6
  weights_path: weights/vit_smallplus_spatial_swiglu_distilled.pth

GTREncoder:
  in_channels: [384, 384, 384]
  hidden_dim: 256

SemSegHead:
  in_channels: 256
  hidden_dim: 256

optimizer:
  params:
    -
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.00012
    -
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.00012
      weight_decay: 0.
    -
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  weight_decay: 0.000125
