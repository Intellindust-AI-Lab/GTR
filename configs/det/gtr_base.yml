task: detection

model: GTR
criterion: GTRCriterion
postprocessor: PostProcessor

use_focal_loss: True
checkpoint_freq: 1
val_freq: 9

GTR:
  backbone: ViTAdapter
  encoder: HybridEncoder
  decoder: GTRTransformer

HybridEncoder:
  in_channels: [192, 192, 192]
  feat_strides: [8, 16, 32]

  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.

  expansion: 1.0
  depth_mult: 1
  act: silu

  csp_type: csp2
  fuse_op: sum

GTRTransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3

  num_layers: 4
  eval_idx: -1
  num_queries: 300

  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0

  reg_max: 32
  reg_scale: 4
  layer_scale: 1

  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default

  activation: silu

  dim_feedforward: 2048

PostProcessor:
  num_top_queries: 300

GTRCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['mal', 'boxes', 'local']
  gamma: 1.5
  alpha: 0.75
  reg_max: 32

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

eval_spatial_size: [640, 640]

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}

      policy: stop_epoch
      start_epoch: 2
      mosaic_epoch: 15
      mosaic_prob: 0
      stop_epoch: 26
      remove_ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']

  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 3
    stop_epoch: 26
    ema_restart_decay: 0.9999
    copyblend_prob: 0
    copyblend_epochs: [4, 50]
    copyblend_type: blend
    area_threshold: 100
    num_objects: 3
    with_expand: True
    expand_ratios: [0.1, 0.25]

  shuffle: True
  total_batch_size: 128
  num_workers: 4

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
      policy: default
  shuffle: False
  total_batch_size: 256
  num_workers: 4

print_freq: 500
output_dir: './logs'

sync_bn: True
find_unused_parameters: True

use_amp: True
scaler:
  type: GradScaler
  enabled: True

use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0

clip_max_norm: 0.1

optimizer:
  type: AdamW

  params:
    -
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.0001
    -
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 30

lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: ~
