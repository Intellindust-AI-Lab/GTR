__include__: [
  '../../dataset/coco_detection.yml',
  '../gtr_base.yml',
]

use_amp: False
val_freq: 1

output_dir: outputs/coco_finetune/gtr_s

GTR:
  backbone: ViTAdapterSpatialSwiGLU
  encoder: GTREncoder
  decoder: GTRTransformer

ViTAdapterSpatialSwiGLU:
  embed_dim: 192
  num_heads: 3
  interaction_indexes: [3, 7, 11]
  multi_layer_same_res: True
  weights_path: weights/vit_tiny_spatial_swiglu_distilled.pth

GTREncoder:
  in_channels: [192, 192, 192]
  hidden_dim: 192
  scale_factors: [2.0, 1.0, 0.5]
  feat_strides: [8, 16, 32]
  num_blocks: 3
  layer_norm: True
  act: silu

GTRTransformer:
  feat_channels: [192, 192, 192]
  hidden_dim: 192
  dim_feedforward: 512
  num_layers: 4
  eval_idx: -1
  group_detr: 3

GTRCriterion:
  group_detr: 3
  losses: ['mal', 'boxes', 'local']
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

optimizer:
  type: AdamW

  params:
    -
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.000015
    -
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.000015
      weight_decay: 0.
    -
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 30
warmup_iter: 2000
lr_gamma: 0.5

eval_spatial_size: [640, 640]

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 50, random_pop: True}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}

      policy: stop_epoch
      start_epoch: 0
      mosaic_epoch: 6
      mosaic_prob: 0.5
      stop_epoch: 28
      remove_ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']

  collate_fn:
    base_size_repeat: ~
    mixup_prob: 0.5
    mixup_epoch: 6

  total_batch_size: 32
