task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 366
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoLmdbDetection
    img_folder: ./dataset/obj365/images
    index_file: ./dataset/obj365/coco_format/annotations/instances_train_index.pkl
    lmdb_path: ./dataset/obj365/coco_format/annotations/instances_train_anns.lmdb
    categories_file: ./dataset/obj365/coco_format/annotations/categories_train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ./dataset/obj365/images
    ann_file: ./dataset/obj365/coco_format/annotations/instances_val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
