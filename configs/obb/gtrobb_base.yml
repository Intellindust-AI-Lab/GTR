task: obb

model: GTR
criterion: OBBGTRCriterion
postprocessor: OBBPostProcessor

use_focal_loss: True
checkpoint_freq: 1
val_freq: 1
use_amp: False

eval_spatial_size: [1024, 1024]

GTR:
  backbone: ViTAdapter
  encoder: GTREncoder
  decoder: OBBGTRTransformer

ViTAdapter:
  interaction_indexes: [3, 7, 11]
  multi_layer_same_res: True
  drop_path_rate: 0.1

GTREncoder:
  scale_factors: [2.0, 1.0, 0.5]
  feat_strides: [8, 16, 32]
  num_blocks: 3
  layer_norm: True
  act: silu

OBBGTRTransformer:
  feat_strides: [8, 16, 32]
  num_levels: 3

  num_layers: 4
  eval_idx: -1
  num_queries: 300
  group_detr: 3

  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0

  reg_max: 32
  reg_scale: 4
  layer_scale: 1

  num_points: [3, 6, 3]
  cross_attn_method: default
  query_select_method: default

  activation: silu

OBBPostProcessor:
  num_top_queries: 300

OBBGTRCriterion:
  weight_dict: {loss_mal: 1, loss_bbox: 5, loss_kld: 5, loss_fgl: 0.15}
  losses: ['mal', 'boxes']
  gamma: 1.5
  alpha: 0.75
  reg_max: 32
  group_detr: 3

  matcher:
    type: OBBHungarianMatcher
    weight_dict: {cost_class: 2, cost_chamfer: 5, cost_kld: 2}
    alpha: 0.25
    gamma: 2.0

train_dataloader:
  type: DataLoader
  dataset:
    type: DOTADetection
    img_folder: ./dataset/DOTA/split_ms_1024_g500_re82/train/images
    ann_folder: ./dataset/DOTA/split_ms_1024_g500_re82/train/annfiles
    filter_empty: True
    transforms:
      type: Compose
      ops:
        - {type: RandomOBBFlip, p: 0.75, directions: ['horizontal', 'vertical', 'diagonal']}
        - {type: RandomOBBRotate, p: 0.5, angle_range: 180, rect_obj_labels: [9, 11]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertDOTABoxes, min_size: 2}
      policy: stop_epoch
      start_epoch: 0
      mosaic_epoch: 6
      mosaic_prob: 0
      stop_epoch: 48
      remove_ops: ['RandomOBBFlip', 'RandomOBBRotate']
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1024
    ema_restart_decay: 0.9999
    mixup_prob: 0
    mixup_epochs: [0, 0]
  shuffle: True
  total_batch_size: 16
  num_workers: 4
  drop_last: True

val_dataloader:
  type: DataLoader
  dataset:
    type: DOTADetection
    img_folder: ./dataset/DOTA/split_ss_1024_re82/val/images
    ann_folder: ./dataset/DOTA/split_ss_1024_re82/val/annfiles
    filter_empty: False
    transforms:
      type: Compose
      ops:
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertDOTABoxes, min_size: 1}
      policy: default
  shuffle: False
  total_batch_size: 32
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 1024

print_freq: 100
output_dir: './logs'

sync_bn: True
find_unused_parameters: True

scaler:
  type: GradScaler
  enabled: True

use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0

clip_max_norm: 0.1

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*.backbone)(?!.*(?:norm|bn|bias)).*$'
      lr: 0.000015
    -
      params: '^(?=.*.backbone)(?=.*(?:norm|bn|bias)).*$'
      lr: 0.000015
      weight_decay: 0.
    -
      params: '^(?!.*\.backbone)(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epochs: 50
lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 2000
flat_epoch: 25
